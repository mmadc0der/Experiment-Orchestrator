[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    redis: Tests requiring Redis
    benchmark: Performance benchmark tests
    security: Security-related tests

# Coverage options
[coverage:run]
source = .
omit = 
    venv/*
    tests/*
    .venv/*
    */tests/*
    setup.py
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

# Benchmark options
[benchmark]
min_rounds = 5
warmup = True
warmup_iterations = 100000
min_time = 0.000005
max_time = 1.0
calibration_precision = 10
disable_gc = False